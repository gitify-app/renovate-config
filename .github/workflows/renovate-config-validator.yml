name: Renovate Config Validation

on:
  # Reusable: consumers call this to validate their own Renovate config.
  workflow_call:
  # Self-triggered: validate the preset files in this repository.
  push:
    branches:
      - main
    paths:
      - "*.json"
      - ".github/workflows/renovate-config-validator.yml"
      - ".nvmrc"
  # Runs on every pull request so the required status check is always reported.
  # A path-filtered required check would block unrelated PRs (e.g. docs-only).
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          version: 12
          node-version-file: .nvmrc
          install: false

      - name: Validate Renovate config
        run: |
          set -euo pipefail
          # Renovate discovers renovate.json / .renovaterc* / package.json by
          # itself. Preset files (default.json) are not discovered, so name them.
          if [ -f default.json ]; then
            set -- ./*.json
          fi
          # --no-global keeps named files as repo config: without it the
          # validator treats CLI arguments as self-hosted global config.
          # renovate is pinned exactly; updates wait for approval on the
          # Dependency Dashboard (see packageRules in renovate.json) so the
          # pin does not chase Renovate's several-per-day releases.
          # Run through pnpm, not npx: consumer package.json files declare a
          # pnpm devEngines.packageManager, and npm refuses to exec anything
          # inside such a project (EBADDEVENGINES).
          pnpm --package=renovate@44.182.2 dlx renovate-config-validator --strict --no-global "$@"
